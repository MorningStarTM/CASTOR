# 50M arm. 42.1M parameters: 25.2M non-embedding, 16.4M embedding.
arm: 50m

model:
  vocab_size: 32000
  block_size: 1024
  n_layer: 8
  n_head: 8
  n_emb: 512
  dropout: 0.0
  tie_embeddings: true

optim:
  learning_rate: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip: 1.0

# ~2.5B tokens, around 60 tokens per parameter.
target_tokens: 2_500_000_000
batch_size: 16
grad_accum_steps: 8

data_dir: data/text_corpus/tokenized
out_dir: experiments/runs
seed: 1337
